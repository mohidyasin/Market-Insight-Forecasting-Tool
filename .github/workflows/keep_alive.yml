name: Keep Streamlit App Alive

on:
  schedule:
    # Run every day at 12:00 UTC
    - cron: '0 12 * * *'
  
  # Optional: Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App URL
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://market-insight-forecasting-tool-fzt2k86xrhjjm9ylkhxarj.streamlit.app/)
          echo "Received status code: $STATUS"
          if [[ $STATUS -ge 200 && $STATUS -lt 400 ]]; then
            echo "Successfully pinged the app!"
            exit 0
          else
            echo "Failed with status code: $STATUS"
            exit 1
          fi
